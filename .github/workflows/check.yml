name: Preset checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presets:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check the catalog
        run: python scripts/presets.py check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reconstruct the portable package
        run: python scripts/presets.py build
      - name: Exercise the installer against a fresh profile
        shell: pwsh
        run: |
          Expand-Archive dist/DSH-PTC-portable.zip -DestinationPath dist/expanded
          $profileFixture = New-Item -ItemType Directory -Path 'dist/test profile'
          & ./dist/expanded/Install-DSH-PTC.ps1 -ProfileDir $profileFixture.FullName
          $patch = Join-Path $profileFixture.FullName 'cordis.patch.yml'
          $before = (Get-FileHash -LiteralPath $patch).Hash
          & ./dist/expanded/Install-DSH-PTC.ps1 -ProfileDir $profileFixture.FullName
          if ((Get-FileHash -LiteralPath $patch).Hash -ne $before) { throw 'Repeat install changed the profile' }
      - name: Verify opt-in teams and rollback
        shell: pwsh
        run: |
          python scripts/presets.py build --team all --output dist/teams.zip
          if ($LASTEXITCODE -ne 0) { throw 'Team build failed' }
          Expand-Archive dist/teams.zip -DestinationPath dist/teams
          $profileFixture = (Resolve-Path -LiteralPath 'dist/test profile').Path
          $patch = Join-Path $profileFixture 'cordis.patch.yml'
          $before = (Get-FileHash -LiteralPath $patch).Hash
          & ./dist/teams/Install-DSH-PTC.ps1 -ProfileDir $profileFixture
          $allowlist = Get-Content -LiteralPath $patch | Select-String '^\s+allowedAgentPresets:'
          foreach ($id in @('review','glm-5-3','gemini-4-neon','grok-4-7','qwen-3-8-max')) {
            if (@($allowlist | Where-Object { $_.Line -notlike "*$id*" }).Count) { throw "Missing allowlisted preset $id" }
          }
          $teamHash = (Get-FileHash -LiteralPath $patch).Hash
          & ./dist/teams/Install-DSH-PTC.ps1 -ProfileDir $profileFixture
          if ((Get-FileHash -LiteralPath $patch).Hash -ne $teamHash) { throw 'Repeat install changed the team profile' }
          & ./dist/expanded/Install-DSH-PTC.ps1 -ProfileDir $profileFixture
          if ((Get-FileHash -LiteralPath $patch).Hash -ne $before) { throw 'Default package did not restore the profile' }
      - name: Install Research Manager with the current High rules
        shell: pwsh
        run: |
          $profileFixture = (New-Item -ItemType Directory -Path 'dist/research profile').FullName
          & ./dist/teams/Install-DSH-PTC.ps1 -ProfileDir $profileFixture
          $patch = Join-Path $profileFixture 'cordis.patch.yml'
          $before = (Get-FileHash -LiteralPath $patch).Hash
          python -B -X utf8 addons/research-manager/install.py --profile-dir $profileFixture
          if ($LASTEXITCODE -ne 0) { throw 'Research Manager preview failed' }
          if ((Get-FileHash -LiteralPath $patch).Hash -ne $before) { throw 'Preview changed the profile' }
          python -B -X utf8 addons/research-manager/install.py --profile-dir $profileFixture --apply
          if ($LASTEXITCODE -ne 0) { throw 'Research Manager install failed' }
          if (@(Select-String -LiteralPath $patch -Pattern '^    - id: preset-research$').Count -ne 1) {
            throw 'Expected one Research Manager declaration'
          }
          $installed = (Get-FileHash -LiteralPath $patch).Hash
          python -B -X utf8 addons/research-manager/install.py --profile-dir $profileFixture --apply
          if ($LASTEXITCODE -ne 0) { throw 'Repeat Research Manager install failed' }
          if ((Get-FileHash -LiteralPath $patch).Hash -ne $installed) { throw 'Repeat install changed the profile' }
      - name: Combine a model preset with a separately installed research preset
        shell: pwsh
        run: |
          python scripts/presets.py build --preset sol-6-2 --output dist/model.zip
          if ($LASTEXITCODE -ne 0) { throw 'Model build failed' }
          python scripts/presets.py build --only --team research --output dist/research.zip
          if ($LASTEXITCODE -ne 0) { throw 'Research build failed' }
          Expand-Archive dist/model.zip -DestinationPath dist/model
          Expand-Archive dist/research.zip -DestinationPath dist/research
          $profileFixture = (New-Item -ItemType Directory -Path 'dist/selective profile').FullName
          & ./dist/model/Install-DSH-PTC.ps1 -ProfileDir $profileFixture
          & ./dist/research/Install-DSH-PTC.ps1 -ProfileDir $profileFixture
          python -B -X utf8 addons/research-manager/install.py --profile-dir $profileFixture --apply
          if ($LASTEXITCODE -ne 0) { throw 'Selective Research Manager install failed' }
          $patch = Join-Path $profileFixture 'cordis.patch.yml'
          $manifest = Get-Content dist/research/manifest.json -Raw | ConvertFrom-Json
          $expected = $manifest.presets.id + @('sol-6-2', 'research')
          $actual = @(Select-String -LiteralPath $patch -Pattern '^        id: ([a-z][\w-]+)$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value })
          if (($actual.Count -ne $expected.Count) -or (Compare-Object $expected $actual)) {
            throw 'Selective install added unexpected presets or lost existing presets'
          }
          $before = (Get-FileHash -LiteralPath $patch).Hash
          & ./dist/model/Install-DSH-PTC.ps1 -ProfileDir $profileFixture
          if ((Get-FileHash -LiteralPath $patch).Hash -ne $before) { throw 'Model reinstall changed the research setup' }
